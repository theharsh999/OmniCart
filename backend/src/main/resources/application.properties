spring.application.name=omnicart
server.port=${SERVER_PORT:8080}

# --- Database (override with environment variables on another computer) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/omnicart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables are generated by JPA/Hibernate (development/demo only)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET:omnicart-local-demo-secret-change-me-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# --- CORS / demo data ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed.enabled=${SEED_DEMO_DATA:true}

logging.level.root=INFO
logging.level.com.omnicart=INFO
